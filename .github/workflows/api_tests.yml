name: API Test Automation Pipeline

on:
    push:
        branches: [ main, master ]
    pull_request:
        branches: [ main, master ]
    workflow_dispatch:

permission:
    contents: write
    pages: write
    id-token: write

jobs: 
    tests:
        name: Run API Tests & Build Allure Report
        runs-on: ubuntu-latest

        steps:
            - name: Check out Repository Code
              uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5 
              with: 
                python-version: "3.11"
                cache: "pip"

            - name: Install Python Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirement.txt

            - name: Execute Pytest Suite with Allure
              run: |
                python -m pytest tests/ --alluredir=allure-result -vs
              continue-on-error: true

            - name: Load Allure Report History
              uses: actions/checkout@v4
              if: always()
              with: 
                ref: gh-pages
                path: gh-pages
                contimue-on-error: true
            
            - name: Set up Java
              uses: actions/setup-java@v4
              if: always()
              with: 
                distribution: 'temurin'
                java-version: '17'

            - name: Install Allure CLI
              if: always()
              run: |
                wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
                tar -zxvf allure-2.29.0.tgz
                sudo mcv allure-2.29.0 /opt/allure
                sudo ln -s /opt/allure/bin/allure /usr/bin/allure

            - name: Genereate Allure Report
              if: always()
              run: |
                if [ -d "gh-pages/history"]; then
                    mkdir -p allure-results/history
                    cp -r gh-pages/history/* allure-results/history/ || true
                fi
                allure generate allure-results --clean -o allure-report
            
            - name: Deploy Allure Report to GitHub pages
              uses: peaceiris/actions-gh-pages@v3
              if: always()
              with: 
                github_token: ${{ secrets.GITHUB_TOKEN}}
                publish_dir: allure-history
                publish_branch: gh-pages
